# OpenTelemetry Metrics Collector ConfigMap file
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  labels:
    app: otel-collector
data:
  config.yaml: |
    extensions:
      basicauth/grafana:
        client_auth:
          username: "${env:GRAFANA_INSTANCE_ID}"
          password: "${env:GRAFANA_API_KEY}"

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus/node-exporter:
        config:
          scrape_configs:
            - job_name: node-exporter
              scrape_interval: 30s
              scrape_timeout: 10s
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names: [otel-system]
                  selectors:
                    - role: pod
                      label: app=node-exporter
                      field: spec.nodeName=${env:KUBE_NODE_NAME}
              relabel_configs:
                - source_labels:
                    [__meta_kubernetes_pod_phase]
                  regex: Running
                  action: keep
                - source_labels:
                    [__meta_kubernetes_pod_container_port_name]
                  regex: metrics
                  action: keep
                - source_labels:
                    [__meta_kubernetes_pod_node_name]
                  target_label: node
                - source_labels:
                    [__meta_kubernetes_pod_node_name]
                  target_label: instance
                  replacement: '$$1:9100'
                - target_label: cluster
                  replacement: observability-lab
                - target_label: environment
                  replacement: dev
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: "node_cpu_seconds_total|\
                    node_load(1|5|15)|\
                    node_memory_(MemTotal|MemAvailable|MemFree|Buffers|Cached|SReclaimable|Shmem|SwapTotal|SwapFree)_bytes|\
                    node_filesystem_(avail_bytes|free_bytes|size_bytes|files|files_free|readonly|device_error)|\
                    node_disk_(read_bytes_total|written_bytes_total|reads_completed_total|writes_completed_total|read_time_seconds_total|write_time_seconds_total|io_time_seconds_total|io_time_weighted_seconds_total|io_now)|\
                    node_network_(receive|transmit)_(bytes|packets|errs|drop)_total|\
                    node_network_(up|speed_bytes)|\
                    node_boot_time_seconds|node_uname_info|\
                    node_scrape_collector_success|node_nfs(d)?_.*"
                  action: keep
                  
            - job_name: node-exporter-nfs
              scrape_interval: 30s
              scrape_timeout: 10s
              static_configs:
                - targets: ['192.168.56.133:9100']
                  labels:
                    cluster: observability-lab
                    environment: dev
                    node: ansible-node
                    instance: ansible-node:9100
              relabel_configs:
                - target_label: __tmp_scraper_node
                  replacement: '${env:KUBE_NODE_NAME}'
                - source_labels: [__tmp_scraper_node]
                  regex: k8s-worker-2
                  action: keep
                - target_label: job
                  replacement: node-exporter
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: "node_cpu_seconds_total|\
                    node_load(1|5|15)|\
                    node_memory_(MemTotal|MemAvailable|MemFree|Buffers|Cached|SReclaimable|Shmem|SwapTotal|SwapFree)_bytes|\
                    node_filesystem_(avail_bytes|free_bytes|size_bytes|files|files_free|readonly|device_error)|\
                    node_disk_(read_bytes_total|written_bytes_total|reads_completed_total|writes_completed_total|read_time_seconds_total|write_time_seconds_total|io_time_seconds_total|io_time_weighted_seconds_total|io_now)|\
                    node_network_(receive|transmit)_(bytes|packets|errs|drop)_total|\
                    node_network_(up|speed_bytes)|\
                    node_boot_time_seconds|node_uname_info|\
                    node_scrape_collector_success|node_nfs(d)?_.*"
                  action: keep

      prometheus/kubelet:
        config:
          scrape_configs:
            - job_name: kubelet
              scheme: https
              metrics_path: /metrics
              scrape_interval: 30s
              scrape_timeout: 10s
              authorization:
                type: Bearer
                credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config:
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                insecure_skip_verify: false
              kubernetes_sd_configs:
                - role: node
                  selectors:
                    - role: node
                      field: metadata.name=${env:KUBE_NODE_NAME}
              relabel_configs:
                - source_labels: [__meta_kubernetes_node_name]
                  target_label: node
                - source_labels: [__meta_kubernetes_node_name]
                  target_label: instance
                  replacement: '$$1:10250'
                - target_label: cluster
                  replacement: observability-lab
                - target_label: environment
                  replacement: dev
                - target_label: scrape_job
                  replacement: kubelet
                - target_label: collector_node
                  replacement: '${env:KUBE_NODE_NAME}'
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: "kubelet_node_name|\
                    kubelet_running_(pods|containers)|\
                    kubelet_runtime_operations_(total|errors_total)|\
                    kubelet_run_podsandbox_errors_total|\
                    kubelet_pleg_last_seen_seconds|\
                    kubelet_volume_stats_(available_bytes|capacity_bytes|used_bytes|inodes|inodes_free|inodes_used)|\
                    kubelet_(pod_start_sli|pleg_relist)_duration_seconds_(bucket|sum|count)"
                  action: keep

            - job_name: cadvisor
              scheme: https
              metrics_path: /metrics/cadvisor
              scrape_interval: 30s
              scrape_timeout: 10s
              authorization:
                type: Bearer
                credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config:
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                insecure_skip_verify: false
              kubernetes_sd_configs:
                - role: node
                  selectors:
                    - role: node
                      field: metadata.name=${env:KUBE_NODE_NAME}
              relabel_configs:
                - source_labels: [__meta_kubernetes_node_name]
                  target_label: node
                - source_labels: [__meta_kubernetes_node_name]
                  target_label: instance
                  replacement: '$$1:10250'
                - target_label: cluster
                  replacement: observability-lab
                - target_label: environment
                  replacement: dev
                - target_label: scrape_job
                  replacement: cadvisor
                - target_label: collector_node
                  replacement: '${env:KUBE_NODE_NAME}'
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: "container_cpu_usage_seconds_total|\
                    container_memory_working_set_bytes|\
                    container_memory_usage_bytes|\
                    container_cpu_cfs_periods_total|\
                    container_cpu_cfs_throttled_periods_total|\
                    container_cpu_cfs_throttled_seconds_total"
                  action: keep

      prometheus/kube-state-metrics:
        trim_metric_suffixes: false
        config:
          scrape_configs:
            - job_name: kube-state-metrics
              metrics_path: /metrics
              scrape_interval: 30s
              scrape_timeout: 10s
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names: [otel-system]
                  selectors:
                    - role: pod
                      label: app=kube-state-metrics
                      field: spec.nodeName=${env:KUBE_NODE_NAME}
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_phase]
                  regex: Running
                  action: keep
                - source_labels: [__meta_kubernetes_pod_ready]
                  regex: "true"
                  action: keep
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  regex: http-metrics
                  action: keep
                - target_label: cluster
                  replacement: observability-lab
                - target_label: environment
                  replacement: dev
                - target_label: scrape_job
                  replacement: kube-state-metrics
                - target_label: instance
                  replacement: kube-state-metrics:8080
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: "kube_pod_(info|owner|deletion_timestamp)|\
                    kube_pod_status_(phase|ready|scheduled|reason|unschedulable)|\
                    kube_pod_(init_)?container_status_(ready|restarts_total|waiting_reason|terminated_reason|last_terminated_reason)|\
                    kube_pod_(init_)?container_resource_(requests|limits)|\
                    kube_pod_spec_volumes_persistentvolumeclaims_info|\
                    kube_deployment_(spec_replicas|metadata_generation)|\
                    kube_deployment_status_(replicas|replicas_ready|replicas_available|replicas_unavailable|replicas_updated|observed_generation|condition)|\
                    kube_daemonset_metadata_generation|\
                    kube_daemonset_status_(current_number_scheduled|desired_number_scheduled|number_available|number_misscheduled|number_ready|number_unavailable|observed_generation|updated_number_scheduled)|\
                    kube_statefulset_(replicas|metadata_generation)|\
                    kube_statefulset_status_(replicas|replicas_current|replicas_ready|replicas_available|replicas_updated|observed_generation|current_revision|update_revision)|\
                    kube_node_(info|spec_unschedulable)|\
                    kube_node_status_(condition|capacity|allocatable)|\
                    kube_persistentvolumeclaim_(info|status_phase|status_condition|resource_requests_storage_bytes|deletion_timestamp)|\
                    kube_persistentvolume_(info|status_phase|capacity_bytes|deletion_timestamp)"
                  action: keep

      prometheus/self:
        config:
          scrape_configs:
            - job_name: otel-collector
              scrape_interval: 30s
              scrape_timeout: 10s
              static_configs:
                - targets: ['127.0.0.1:8888']
                  labels:
                    cluster: observability-lab
                    environment: dev
                    node: '${env:KUBE_NODE_NAME}'
                    instance: '${env:KUBE_NODE_NAME}:8888'
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: "otelcol_receiver_(accepted|refused)_metric_points|\
                    otelcol_exporter_(sent|send_failed|enqueue_failed)_metric_points|\
                    otelcol_exporter_queue_(size|capacity)|\
                    otelcol_process_memory_rss"
                  action: keep

      filelog:
        include: [/var/log/pods/*/*/*.log]
        exclude: [/var/log/pods/*/otel-collector/*.log]
        start_at: end
        include_file_path: true
        include_file_name: false
        operators:
        - type: container

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 200
        spike_limit_mib: 50

      k8sattributes:
        auth_type: "serviceAccount"
        filter:
          node_from_env_var: KUBE_NODE_NAME
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.namespace.name
            - k8s.node.name
            - k8s.deployment.name
            - k8s.replicaset.name
            - k8s.daemonset.name
            - k8s.statefulset.name
        pod_association:
          - sources:
            - from: resource_attribute
              name: k8s.pod.name
          - sources:
            - from: resource_attribute
              name: k8s.pod.ip
          - sources:
            - from: connection

      resource/node-exporter:
        attributes:
          - key: k8s.pod.name
            action: delete
          - key: k8s.pod.uid
            action: delete

      resource/ksm:
        attributes:
          - key: k8s.pod.name
            action: delete
          - key: k8s.pod.uid
            action: delete
          - key: k8s.container.name
            action: delete
          - key: k8s.namespace.name
            action: delete
          - key: k8s.node.name
            action: delete
          - key: k8s.replicaset.name
            action: delete

      transform:
        error_mode: ignore
        log_statements:
          - context: log
            conditions:
              - 'resource.attributes["k8s.namespace.name"] == "spring-app" and resource.attributes["k8s.container.name"] == "spring-app" and IsString(log.body)'
            statements:
              - 'set(log.cache["json"], ParseJSON(log.body)) where IsMatch(log.body, "^\\s*\\{")'
              - 'set(log.attributes["operation"], log.cache["json"]["operation"])'
              - 'set(log.attributes["result"], log.cache["json"]["result"])'
              - 'set(log.attributes["testRunId"], log.cache["json"]["testRunId"])'
              - 'set(log.attributes["recordId"], log.cache["json"]["recordId"])'
              - 'set(log.attributes["returnedRows"], Int(log.cache["json"]["returnedRows"])) where log.cache["json"]["returnedRows"] != nil'
              - 'set(log.attributes["deletedCount"], Int(log.cache["json"]["deletedCount"])) where log.cache["json"]["deletedCount"] != nil'
              - 'set(log.attributes["exceptionType"], log.cache["json"]["exceptionType"])'
              - 'set(log.attributes["exceptionCauseTypes"], log.cache["json"]["exceptionCauseTypes"])'
              - 'set(log.attributes["exceptionStackFrames"], log.cache["json"]["exceptionStackFrames"])'
              - 'set(log.severity_text, log.cache["json"]["level"]) where IsString(log.cache["json"]["level"])'
              - 'set(log.severity_number, SEVERITY_NUMBER_TRACE) where log.cache["json"]["level"] == "TRACE"'
              - 'set(log.severity_number, SEVERITY_NUMBER_DEBUG) where log.cache["json"]["level"] == "DEBUG"'
              - 'set(log.severity_number, SEVERITY_NUMBER_INFO) where log.cache["json"]["level"] == "INFO"'
              - 'set(log.severity_number, SEVERITY_NUMBER_WARN) where log.cache["json"]["level"] == "WARN"'
              - 'set(log.severity_number, SEVERITY_NUMBER_ERROR) where log.cache["json"]["level"] == "ERROR"'
              - 'set(log.time, Time(log.cache["json"]["@timestamp"], "%Y-%m-%dT%H:%M:%S%z")) where IsString(log.cache["json"]["@timestamp"])'
              - 'set(log.cache["valid_json_ids"], true) where IsString(log.cache["json"]["traceId"]) and IsString(log.cache["json"]["spanId"]) and IsMatch(log.cache["json"]["traceId"], "^[a-f0-9]{32}$") and IsMatch(log.cache["json"]["spanId"], "^[a-f0-9]{16}$") and log.cache["json"]["traceId"] != "00000000000000000000000000000000" and log.cache["json"]["spanId"] != "0000000000000000"'
              - 'set(log.trace_id.string, log.cache["json"]["traceId"]) where log.cache["valid_json_ids"] == true'
              - 'set(log.span_id.string, log.cache["json"]["spanId"]) where log.cache["valid_json_ids"] == true'
          - context: log
            conditions:
              - 'IsString(log.body) and not IsMatch(log.body, "^\\s*\\{")'
            statements:
              - 'set(log.cache["legacy"], ExtractPatterns(log.body, "\\[traceId=(?P<t>[a-f0-9]{32}),spanId=(?P<s>[a-f0-9]{16})\\]"))'
              - 'set(log.cache["valid_legacy_ids"], true) where log.cache["legacy"]["t"] != nil and log.cache["legacy"]["s"] != nil and log.cache["legacy"]["t"] != "00000000000000000000000000000000" and log.cache["legacy"]["s"] != "0000000000000000"'
              - 'set(log.trace_id.string, log.cache["legacy"]["t"]) where log.cache["valid_legacy_ids"] == true'
              - 'set(log.span_id.string, log.cache["legacy"]["s"]) where log.cache["valid_legacy_ids"] == true'
      
      batch:
        timeout: 10s
        send_batch_size: 1024

    exporters:
      otlphttp/grafana:
        endpoint: "${env:GRAFANA_OTLP_ENDPOINT}"
        auth:
          authenticator: basicauth/grafana

    service:
      telemetry:
        resource:
          service.name: otel-collector
          service.instance.id: '${env:KUBE_NODE_NAME}:8888'
        metrics:
          level: normal
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: '127.0.0.1'
                    port: 8888
                    without_scope_info: true
                    without_type_suffix: true
                    without_units: true
                    with_resource_constant_labels:
                      included: []

      extensions: [basicauth/grafana]
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp/grafana]
        metrics/self:
          receivers: [prometheus/self]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/grafana]
        metrics/node-exporter:
          receivers: [prometheus/node-exporter]
          processors: [memory_limiter, resource/node-exporter, batch]
          exporters: [otlphttp/grafana]
        metrics/kubelet:
          receivers: [prometheus/kubelet]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/grafana]
        metrics/kube-state-metrics:
          receivers: [prometheus/kube-state-metrics]
          processors: [memory_limiter, resource/ksm, batch]
          exporters: [otlphttp/grafana]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp/grafana]
        logs:
          receivers: [filelog]
          processors: [memory_limiter, k8sattributes, transform, batch]
          exporters: [otlphttp/grafana]