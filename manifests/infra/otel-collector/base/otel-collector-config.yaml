# OpenTelemetry Metrics Collector ConfigMap file
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  labels:
    app: otel-collector
data:
  config.yaml: |
    extensions:
      basicauth/grafana:
        client_auth:
          username: "${env:GRAFANA_INSTANCE_ID}"
          password: "${env:GRAFANA_API_KEY}"

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus/node-exporter:
        config:
          scrape_configs:
            - job_name: node-exporter
              scrape_interval: 30s
              scrape_timeout: 10s
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names: [otel-system]
                  selectors:
                    - role: pod
                      label: app=node-exporter
                      field: spec.nodeName=${env:KUBE_NODE_NAME}
              relabel_configs:
                - source_labels:
                    [__meta_kubernetes_pod_phase]
                  regex: Running
                  action: keep
                - source_labels:
                    [__meta_kubernetes_pod_container_port_name]
                  regex: metrics
                  action: keep
                - source_labels:
                    [__meta_kubernetes_pod_node_name]
                  target_label: node
                - source_labels:
                    [__meta_kubernetes_pod_node_name]
                  target_label: instance
                  replacement: '$$1:9100'
                - target_label: cluster
                  replacement: observability-lab
                - target_label: environment
                  replacement: dev
                  
            - job_name: node-exporter-nfs
              scrape_interval: 30s
              scrape_timeout: 10s
              static_configs:
                - targets: ['192.168.56.133:9100']
                  labels:
                    cluster: observability-lab
                    environment: dev
                    node: ansible-node
                    instance: ansible-node:9100
              relabel_configs:
                - target_label: __tmp_scraper_node
                  replacement: '${env:KUBE_NODE_NAME}'
                - source_labels: [__tmp_scraper_node]
                  regex: k8s-worker-2
                  action: keep
                - target_label: job
                  replacement: node-exporter

      prometheus/kubelet:
        config:
          scrape_configs:
            - job_name: kubelet
              scheme: https
              metrics_path: /metrics
              scrape_interval: 30s
              scrape_timeout: 10s
              authorization:
                type: Bearer
                credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config:
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                insecure_skip_verify: false
              kubernetes_sd_configs:
                - role: node
                  selectors:
                    - role: node
                      field: metadata.name=${env:KUBE_NODE_NAME}
              relabel_configs:
                - source_labels: [__meta_kubernetes_node_name]
                  target_label: node
                - target_label: cluster
                  replacement: observability-lab
                - target_label: environment
                  replacement: dev
                - target_label: scrape_job
                  replacement: kubelet
                - target_label: collector_node
                  replacement: '${env:KUBE_NODE_NAME}'

            - job_name: cadvisor
              scheme: https
              metrics_path: /metrics/cadvisor
              scrape_interval: 30s
              scrape_timeout: 10s
              authorization:
                type: Bearer
                credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config:
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                insecure_skip_verify: false
              kubernetes_sd_configs:
                - role: node
                  selectors:
                    - role: node
                      field: metadata.name=${env:KUBE_NODE_NAME}
              relabel_configs:
                - source_labels: [__meta_kubernetes_node_name]
                  target_label: node
                - target_label: cluster
                  replacement: observability-lab
                - target_label: environment
                  replacement: dev
                - target_label: scrape_job
                  replacement: cadvisor
                - target_label: collector_node
                  replacement: '${env:KUBE_NODE_NAME}'
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: 'container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_memory_usage_bytes|container_cpu_cfs_periods_total|container_cpu_cfs_throttled_periods_total|container_cpu_cfs_throttled_seconds_total'
                  action: keep

      filelog:
        include: [/var/log/pods/*/*/*.log]
        exclude: [/var/log/pods/*/otel-collector/*.log]
        start_at: end
        include_file_path: true
        include_file_name: false
        operators:
        - type: container

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 200
        spike_limit_mib: 50

      k8sattributes:
        auth_type: "serviceAccount"
        filter:
          node_from_env_var: KUBE_NODE_NAME
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.namespace.name
            - k8s.node.name
            - k8s.deployment.name
            - k8s.replicaset.name
            - k8s.daemonset.name
            - k8s.statefulset.name
        pod_association:
          - sources:
            - from: resource_attribute
              name: k8s.pod.name
          - sources:
            - from: resource_attribute
              name: k8s.pod.ip
          - sources:
            - from: connection

      transform:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(cache, ExtractPatterns(body, "traceId=(?P<t>[a-f0-9]+),spanId=(?P<s>[a-f0-9]+)"))
              - set(trace_id.string, cache["t"])
              - set(span_id.string, cache["s"])
      
      batch:
        timeout: 10s
        send_batch_size: 1024

    exporters:
      otlphttp/grafana:
        endpoint: "${env:GRAFANA_OTLP_ENDPOINT}"
        auth:
          authenticator: basicauth/grafana

    service:
      extensions: [basicauth/grafana]
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp/grafana]
        metrics/node-exporter:
          receivers: [prometheus/node-exporter]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/grafana]
        metrics/kubelet:
          receivers: [prometheus/kubelet]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/grafana]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp/grafana]
        logs:
          receivers: [filelog]
          processors: [memory_limiter, k8sattributes, transform, batch]
          exporters: [otlphttp/grafana]