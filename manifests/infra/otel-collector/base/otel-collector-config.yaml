# OpenTelemetry Metrics Collector ConfigMap file
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  labels:
    app: otel-collector
data:
  config.yaml: |
    extensions:
      basicauth/grafana:
        client_auth:
          username: "${env:GRAFANA_INSTANCE_ID}"
          password: "${env:GRAFANA_API_KEY}"

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus/node-exporter:
        config:
          scrape_configs:
            - job_name: node-exporter
              scrape_interval: 30s
              scrape_timeout: 10s
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names: [otel-system]
                  selectors:
                    - role: pod
                      label: app=node-exporter
                      field: spec.nodeName=${env:KUBE_NODE_NAME}
              relabel_configs:
                - source_labels:
                    [__meta_kubernetes_pod_phase]
                  regex: Running
                  action: keep
                - source_labels:
                    [__meta_kubernetes_pod_container_port_name]
                  regex: metrics
                  action: keep
                - source_labels:
                    [__meta_kubernetes_pod_node_name]
                  target_label: node
                - source_labels:
                    [__meta_kubernetes_pod_node_name]
                  target_label: instance
                  replacement: '$$1:9100'
                - target_label: cluster
                  replacement: observability-lab
                - target_label: environment
                  replacement: dev
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: "node_cpu_seconds_total|\
                    node_load(1|5|15)|\
                    node_memory_(MemTotal|MemAvailable|MemFree|Buffers|Cached|SReclaimable|Shmem|SwapTotal|SwapFree)_bytes|\
                    node_filesystem_(avail_bytes|free_bytes|size_bytes|files|files_free|readonly|device_error)|\
                    node_disk_(read_bytes_total|written_bytes_total|reads_completed_total|writes_completed_total|read_time_seconds_total|write_time_seconds_total|io_time_seconds_total|io_time_weighted_seconds_total|io_now)|\
                    node_network_(receive|transmit)_(bytes|packets|errs|drop)_total|\
                    node_network_(up|speed_bytes)|\
                    node_boot_time_seconds|node_uname_info|\
                    node_scrape_collector_success|node_nfs(d)?_.*"
                  action: keep
                  
            - job_name: node-exporter-nfs
              scrape_interval: 30s
              scrape_timeout: 10s
              static_configs:
                - targets: ['192.168.56.133:9100']
                  labels:
                    cluster: observability-lab
                    environment: dev
                    node: ansible-node
                    instance: ansible-node:9100
              relabel_configs:
                - target_label: __tmp_scraper_node
                  replacement: '${env:KUBE_NODE_NAME}'
                - source_labels: [__tmp_scraper_node]
                  regex: k8s-worker-2
                  action: keep
                - target_label: job
                  replacement: node-exporter
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: "node_cpu_seconds_total|\
                    node_load(1|5|15)|\
                    node_memory_(MemTotal|MemAvailable|MemFree|Buffers|Cached|SReclaimable|Shmem|SwapTotal|SwapFree)_bytes|\
                    node_filesystem_(avail_bytes|free_bytes|size_bytes|files|files_free|readonly|device_error)|\
                    node_disk_(read_bytes_total|written_bytes_total|reads_completed_total|writes_completed_total|read_time_seconds_total|write_time_seconds_total|io_time_seconds_total|io_time_weighted_seconds_total|io_now)|\
                    node_network_(receive|transmit)_(bytes|packets|errs|drop)_total|\
                    node_network_(up|speed_bytes)|\
                    node_boot_time_seconds|node_uname_info|\
                    node_scrape_collector_success|node_nfs(d)?_.*"
                  action: keep

      prometheus/kubelet:
        config:
          scrape_configs:
            - job_name: kubelet
              scheme: https
              metrics_path: /metrics
              scrape_interval: 30s
              scrape_timeout: 10s
              authorization:
                type: Bearer
                credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config:
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                insecure_skip_verify: false
              kubernetes_sd_configs:
                - role: node
                  selectors:
                    - role: node
                      field: metadata.name=${env:KUBE_NODE_NAME}
              relabel_configs:
                - source_labels: [__meta_kubernetes_node_name]
                  target_label: node
                - source_labels: [__meta_kubernetes_node_name]
                  target_label: instance
                  replacement: '$$1:10250'
                - target_label: cluster
                  replacement: observability-lab
                - target_label: environment
                  replacement: dev
                - target_label: scrape_job
                  replacement: kubelet
                - target_label: collector_node
                  replacement: '${env:KUBE_NODE_NAME}'
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: "kubelet_node_name|\
                    kubelet_running_(pods|containers)|\
                    kubelet_runtime_operations_(total|errors_total)|\
                    kubelet_run_podsandbox_errors_total|\
                    kubelet_pleg_last_seen_seconds|\
                    kubelet_volume_stats_(available_bytes|capacity_bytes|used_bytes|inodes|inodes_free|inodes_used)|\
                    kubelet_(pod_start_sli|pleg_relist)_duration_seconds_(bucket|sum|count)"
                  action: keep

            - job_name: cadvisor
              scheme: https
              metrics_path: /metrics/cadvisor
              scrape_interval: 30s
              scrape_timeout: 10s
              authorization:
                type: Bearer
                credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config:
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                insecure_skip_verify: false
              kubernetes_sd_configs:
                - role: node
                  selectors:
                    - role: node
                      field: metadata.name=${env:KUBE_NODE_NAME}
              relabel_configs:
                - source_labels: [__meta_kubernetes_node_name]
                  target_label: node
                - source_labels: [__meta_kubernetes_node_name]
                  target_label: instance
                  replacement: '$$1:10250'
                - target_label: cluster
                  replacement: observability-lab
                - target_label: environment
                  replacement: dev
                - target_label: scrape_job
                  replacement: cadvisor
                - target_label: collector_node
                  replacement: '${env:KUBE_NODE_NAME}'
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: "kubelet_node_name|\
                    kubelet_running_(pods|containers)|\
                    kubelet_runtime_operations_(total|errors_total)|\
                    kubelet_run_podsandbox_errors_total|\
                    kubelet_pleg_last_seen_seconds|\
                    kubelet_volume_stats_(available_bytes|capacity_bytes|used_bytes|inodes|inodes_free|inodes_used)|\
                    kubelet_(pod_start_sli|pleg_relist)_duration_seconds_(bucket|sum|count)"
                  action: keep

      prometheus/kube-state-metrics:
        trim_metric_suffixes: false
        config:
          scrape_configs:
            - job_name: kube-state-metrics
              metrics_path: /metrics
              scrape_interval: 30s
              scrape_timeout: 10s
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names: [otel-system]
                  selectors:
                    - role: pod
                      label: app=kube-state-metrics
                      field: spec.nodeName=${env:KUBE_NODE_NAME}
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_phase]
                  regex: Running
                  action: keep
                - source_labels: [__meta_kubernetes_pod_ready]
                  regex: "true"
                  action: keep
                - source_labels: [__meta_kubernetes_pod_container_port_name]
                  regex: http-metrics
                  action: keep
                - target_label: cluster
                  replacement: observability-lab
                - target_label: environment
                  replacement: dev
                - target_label: scrape_job
                  replacement: kube-state-metrics
                - target_label: instance
                  replacement: kube-state-metrics:8080
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: "kube_pod_(info|owner|deletion_timestamp)|\
                    kube_pod_status_(phase|ready|scheduled|reason|unschedulable)|\
                    kube_pod_(init_)?container_status_(ready|restarts_total|waiting_reason|terminated_reason|last_terminated_reason)|\
                    kube_pod_(init_)?container_resource_(requests|limits)|\
                    kube_pod_spec_volumes_persistentvolumeclaims_info|\
                    kube_deployment_(spec_replicas|metadata_generation)|\
                    kube_deployment_status_(replicas|replicas_ready|replicas_available|replicas_unavailable|replicas_updated|observed_generation|condition)|\
                    kube_daemonset_metadata_generation|\
                    kube_daemonset_status_(current_number_scheduled|desired_number_scheduled|number_available|number_misscheduled|number_ready|number_unavailable|observed_generation|updated_number_scheduled)|\
                    kube_statefulset_(replicas|metadata_generation)|\
                    kube_statefulset_status_(replicas|replicas_current|replicas_ready|replicas_available|replicas_updated|observed_generation|current_revision|update_revision)|\
                    kube_node_(info|spec_unschedulable)|\
                    kube_node_status_(condition|capacity|allocatable)|\
                    kube_persistentvolumeclaim_(info|status_phase|status_condition|resource_requests_storage_bytes|deletion_timestamp)|\
                    kube_persistentvolume_(info|status_phase|capacity_bytes|deletion_timestamp)"
                  action: keep

      filelog:
        include: [/var/log/pods/*/*/*.log]
        exclude: [/var/log/pods/*/otel-collector/*.log]
        start_at: end
        include_file_path: true
        include_file_name: false
        operators:
        - type: container

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 200
        spike_limit_mib: 50

      k8sattributes:
        auth_type: "serviceAccount"
        filter:
          node_from_env_var: KUBE_NODE_NAME
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.namespace.name
            - k8s.node.name
            - k8s.deployment.name
            - k8s.replicaset.name
            - k8s.daemonset.name
            - k8s.statefulset.name
        pod_association:
          - sources:
            - from: resource_attribute
              name: k8s.pod.name
          - sources:
            - from: resource_attribute
              name: k8s.pod.ip
          - sources:
            - from: connection

      resource/ksm:
        attributes:
          - key: k8s.pod.name
            action: delete
          - key: k8s.pod.uid
            action: delete
          - key: k8s.container.name
            action: delete
          - key: k8s.namespace.name
            action: delete
          - key: k8s.node.name
            action: delete
          - key: k8s.replicaset.name
            action: delete

      transform:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(cache, ExtractPatterns(body, "traceId=(?P<t>[a-f0-9]+),spanId=(?P<s>[a-f0-9]+)"))
              - set(trace_id.string, cache["t"])
              - set(span_id.string, cache["s"])
      
      batch:
        timeout: 10s
        send_batch_size: 1024

    exporters:
      otlphttp/grafana:
        endpoint: "${env:GRAFANA_OTLP_ENDPOINT}"
        auth:
          authenticator: basicauth/grafana

    service:
      extensions: [basicauth/grafana]
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp/grafana]
        metrics/node-exporter:
          receivers: [prometheus/node-exporter]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/grafana]
        metrics/kubelet:
          receivers: [prometheus/kubelet]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/grafana]
        metrics/kube-state-metrics:
          receivers: [prometheus/kube-state-metrics]
          processors: [memory_limiter, resource/ksm, batch]
          exporters: [otlphttp/grafana]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp/grafana]
        logs:
          receivers: [filelog]
          processors: [memory_limiter, k8sattributes, transform, batch]
          exporters: [otlphttp/grafana]