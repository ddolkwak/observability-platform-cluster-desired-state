# Node Exporter Application Declaration File
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-exporter
  namespace: argocd
spec:
  project: gitops
  source:
    repoURL: 'git@github.com:ddolkwak/observability-platform-cluster-desired-state.git'
    targetRevision: HEAD
    path: manifests/infra/node-exporter/base
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: otel-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true